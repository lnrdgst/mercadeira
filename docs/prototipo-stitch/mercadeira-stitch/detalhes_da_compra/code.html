        /* Custom Checkbox Styling */
        input[type="checkbox"] {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 24px;
            height: 24px;
            border: 2px solid #bccbb9; /* outline-variant */
            border-radius: 9999px; /* fully rounded */
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        input[type="checkbox"]::before {
            content: "";
            width: 12px;
            height: 12px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        input[type="checkbox"]:checked {
            background-color: #22c55e; /* primary-container */
            border-color: #22c55e;
        }

        input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

<script>
        // Optional subtle header shadow on scroll
        const header = document.querySelector('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 10) {
                header.classList.add('shadow-sm');
                header.classList.remove('border-surface-container-low');
                header.classList.add('border-transparent');
            } else {
                header.classList.remove('shadow-sm');
                header.classList.add('border-surface-container-low');
                header.classList.remove('border-transparent');
            }
        });
