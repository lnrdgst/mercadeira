<!DOCTYPE html>

                      "lg": "24px",
                      "xl": "32px",
                      "sm": "8px",
                      "md": "16px",

                      "touch_target_min": "56px",
                      "xs": "4px",
                      "margin": "20px"
              },
              "fontFamily": {
                      "display": ["Plus Jakarta Sans"],
                      "headline-lg": ["Plus Jakarta Sans"],

<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
          font-variation-settings: 'FILL' 1;
        }
        
        /* Bottom Sheet Animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-sheet {
            animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background h-full font-sans antialiased overflow-hidden">
<!-- Mock Background Content (Dimmed) -->
<div class="h-full w-full flex flex-col pointer-events-none opacity-40">
<!-- TopAppBar (Simulated) -->
<header class="flex justify-between items-center w-full px-margin py-sm max-w-screen-xl mx-auto bg-surface">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A smiling adult face representing a user profile picture, brightly lit, modern corporate style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuADyEnJJaGX7rRXHMqn9yX2Va8jvdfGP7O1ldFiOJM9Egg2XIlxU5CusMrZriskYe6VikG0WPeNWQsGb-Rm8Ox9d0tMiUMmr234itG88e-JQ3Pa3uJJ7VoGp-Ln35UIu3kctw30EkOYmJvJAh3MdPTG6gR75TeXQfR0ZiKriz-iGofq4U4wyKSZcQecZJtT_G8b1rGKc7axZNZzZentY3sgcCVYkHaGt7S83vSPjhUOJmssFWeFG9NPSA"/>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Smith Family</h1>
</div>
<button class="p-2 text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Canvas (Simulated List) -->
<main class="flex-1 px-margin py-lg space-y-md">
<h2 class="font-headline-lg text-headline-lg text-on-background">Preparation List</h2>
<div class="bg-surface-container-low rounded-xl p-md border border-surface-variant shadow-sm flex items-center gap-md">
<div class="w-8 h-8 rounded-full border-2 border-outline flex items-center justify-center"></div>
<div class="flex-1">
<p class="font-body-lg text-body-lg font-medium">Organic Milk</p>
<p class="font-body-md text-body-md text-on-surface-variant">2 liters</p>
</div>
</div>
<div class="bg-surface-container-low rounded-xl p-md border border-surface-variant shadow-sm flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-sm">check</span>
</div>
<div class="flex-1 opacity-50 line-through">
<p class="font-body-lg text-body-lg font-medium">Whole Wheat Bread</p>
<p class="font-body-md text-body-md text-on-surface-variant">1 loaf</p>
</div>
</div>
</main>
</div>
<!-- Overlay / Backdrop -->
<div class="fixed inset-0 bg-on-background/30 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Bottom Sheet -->
<div class="fixed bottom-0 left-0 w-full bg-surface rounded-t-[32px] shadow-[0_-8px_30px_rgba(0,0,0,0.08)] z-50 bottom-sheet flex flex-col max-h-[795px]">
<!-- Handle -->
<div class="w-full flex justify-center pt-md pb-sm">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Sheet Header -->
<div class="px-margin pb-md flex justify-between items-center border-b border-surface-variant">
<h2 class="font-headline-lg text-headline-lg text-on-background">Add Item</h2>
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<div class="px-margin py-lg overflow-y-auto flex-1 space-y-lg">
<!-- Product Name -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-sm ml-sm">Product Name</label>
<div class="relative">
<input class="w-full h-touch_target_min bg-surface-container-lowest border border-outline-variant rounded-full px-lg font-body-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-outline" placeholder="e.g. Apples" type="text"/>
</div>
</div>
<!-- Quantity & Unit Row -->
<div class="flex gap-md">
<div class="flex-1">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-sm ml-sm">Quantity</label>
<div class="flex items-center bg-surface-container-lowest border border-outline-variant rounded-full h-touch_target_min px-sm overflow-hidden focus-within:ring-2 focus-within:ring-primary focus-within:border-primary transition-all">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="w-full text-center bg-transparent border-none focus:ring-0 font-headline-md text-headline-md text-on-background p-0" type="number" value="1"/>
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<div class="flex-1">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-sm ml-sm">Unit</label>
<div class="relative h-touch_target_min">
<select class="w-full h-full appearance-none bg-surface-container-lowest border border-outline-variant rounded-full px-lg font-body-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all pr-12">
<option value="unit">unit</option>
<option value="kg">kg</option>
<option value="g">g</option>
<option value="liter">liter</option>
<option value="ml">ml</option>
<option value="pack">pack</option>
<option value="box">box</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-lg pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Optional Brand -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-sm ml-sm">Brand <span class="text-outline font-normal">(Optional)</span></label>
<div class="relative">
<span class="material-symbols-outlined absolute left-lg top-1/2 -translate-y-1/2 text-outline-variant">sell</span>
<input class="w-full h-touch_target_min bg-surface-container-lowest border border-outline-variant rounded-full pl-[56px] pr-lg font-body-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-outline" placeholder="e.g. Whole Foods" type="text"/>
</div>
</div>
<!-- Optional Observation -->
<div>
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-sm ml-sm">Observation <span class="text-outline font-normal">(Optional)</span></label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-[24px] p-lg font-body-lg text-body-lg text-on-background focus:ring-2 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-outline resize-none" placeholder="e.g. Get the green ones if possible" rows="3"></textarea>
</div>
<!-- Spacing for bottom button -->
<div class="h-24"></div>
</div>
<!-- Fixed Bottom Action -->
<div class="absolute bottom-0 left-0 w-full p-margin bg-gradient-to-t from-surface via-surface to-transparent pt-lg pb-safe">
<button class="w-full h-touch_target_min bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-full shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm">
<span class="material-symbols-outlined filled-icon">check_circle</span>
                Save Item
            </button>
</div>
</div>
</body></html>
