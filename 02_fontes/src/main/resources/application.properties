spring.application.name=mercadeira.api
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mercadeira}
spring.datasource.username=${DB_USER:mercadeira_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health

mercadeira.jwt.secret=${JWT_SECRET}
mercadeira.jwt.duracao=${JWT_DURATION:PT1H}

mercadeira.password-reset.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
mercadeira.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
mercadeira.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
mercadeira.email.provider=${EMAIL_PROVIDER:smtp}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:true}
mercadeira.mail.from=${MAIL_FROM:}
mercadeira.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
mercadeira.resend.api-key=${RESEND_API_KEY:}
mercadeira.resend.http-timeout=${RESEND_HTTP_TIMEOUT:PT10S}
